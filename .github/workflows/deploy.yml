name: Build & Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Frontend build ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: |
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            yarn install
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          # A URL do backend usada pelo build de produção. Configure em Settings > Secrets.
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          CI: "false"  # evita quebrar build por warnings do CRA
        run: yarn build

      # ---------- Backend prepara (sem build; Python só copia) ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate backend syntax
        working-directory: backend
        run: |
          python -m compileall -q .

      # ---------- Cria pacote de deploy ----------
      - name: Prepare release bundle
        run: |
          mkdir -p release/backend release/frontend
          # Backend: copia tudo exceto __pycache__ e uploads temporários
          rsync -a --exclude='__pycache__' --exclude='*.pyc' --exclude='uploads' \
                --exclude='.env' backend/ release/backend/
          # Frontend: apenas o build já compilado + package.json p/ referência
          cp -r frontend/build release/frontend/build
          cp frontend/package.json release/frontend/
          # Manifests úteis pra debug
          echo "commit=${GITHUB_SHA}" > release/RELEASE.txt
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> release/RELEASE.txt
          echo "ref=${GITHUB_REF}" >> release/RELEASE.txt

      - name: Show release size
        run: du -sh release/backend release/frontend/build

      # ---------- Deploy via SSH ----------
      - name: Deploy to production server (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.env' --exclude='uploads' --exclude='__pycache__'
          path: release/
          remote_path: ${{ secrets.DEPLOY_PATH || '/app/' }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT || '22' }}

      - name: Restart services on remote
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/app' }}
            # Instala/atualiza deps do backend (rápido se cache HIT)
            if [ -f backend/requirements.txt ]; then
              cd backend && pip install -q -r requirements.txt --break-system-packages 2>/dev/null || pip install -q -r requirements.txt || true
              cd ..
            fi
            # Reinicia serviços (assume supervisor já configurado)
            sudo supervisorctl restart backend || sudo systemctl restart oxxpharma-backend || true
            sudo supervisorctl restart frontend || sudo systemctl restart oxxpharma-frontend || true
            # Healthcheck rápido
            sleep 3
            curl -fsS http://localhost:8001/api/health || echo "⚠ Backend health check falhou"

      - name: Notify success
        if: success()
        run: echo "✅ Deploy concluído com sucesso · commit ${GITHUB_SHA:0:7}"
